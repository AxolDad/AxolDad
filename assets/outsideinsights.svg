<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Indigo/Blue to Dark Slate -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="30%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Teal Gradient for Checkmark -->
    <linearGradient id="neon-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glowing Blue Gradient for Ring -->
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glass Highlight Border Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter for Neon Checkmark -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Glow for Ring -->
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic/Glass Outer Frame Gradient -->
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#475569" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Outer Glassmorphic Rounded Square Frame -->
  <rect x="20" y="20" width="472" height="472" rx="130" fill="url(#bg-grad)" stroke="url(#frame-grad)" stroke-width="12" />

  <!-- Inner Glass Reflection / Highlight Ring on border -->
  <rect x="32" y="32" width="448" height="448" rx="118" fill="none" stroke="url(#glass-border)" stroke-width="4" />

  <!-- The Circular Ring (Glowing Blue) -->
  <!-- Subtle back glow -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="url(#neon-blue)" stroke-width="26" opacity="0.3" filter="url(#glow-heavy)" />
  <!-- Main ring -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="url(#neon-blue)" stroke-width="18" opacity="0.75" />
  <!-- White highlight core on ring -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.3" />

  <!-- The Checkmark (Glowing Teal) -->
  <!-- Heavy back glow -->
  <path d="M 180 255 L 240 315 L 370 170" fill="none" stroke="url(#neon-teal)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow-heavy)" />
  <!-- Main checkmark stroke -->
  <path d="M 180 255 L 240 315 L 370 170" fill="none" stroke="url(#neon-teal)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  <!-- White inner core for 3D glow effect -->
  <path d="M 180 255 L 240 315 L 370 170" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Glossy Reflection Sweep across the entire card -->
  <path d="M 40 180 C 130 65, 382 65, 472 180" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.07" stroke-linecap="round" />
</svg>
